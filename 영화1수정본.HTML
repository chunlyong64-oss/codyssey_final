<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영화 티어리스트</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #e50914;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { margin-bottom: 20px; color: var(--accent-color); }

        /* 입력 영역 */
        .input-section {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        input {
            padding: 10px;
            border-radius: 4px;
            border: none;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #b20710; }

        /* 영화 보관함 */
        .storage-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            min-height: 100px;
        }

        /* 티어 리스트 스타일 */
        .tier-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tier-row {
            display: flex;
            min-height: 100px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }

        /* 티어별 색상 */
        .s-tier { background-color: #ff7f7f; }
        .a-tier { background-color: #ffbf7f; }
        .b-tier { background-color: #ffff7f; }
        .c-tier { background-color: #7fff7f; }

        /* 드롭 구역 */
        .drop-zone {
            flex-grow: 1;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .drop-zone:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* 영화 아이템 카드 */
        .movie-item {
            background-color: #fff;
            color: #000;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: grab;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            user-select: none;
        }

        .movie-item:active { cursor: grabbing; }
    </style>
</head>
<body>

    <h1>🎬 Movie Tier List</h1>

    <!-- 영화 추가 입력창 -->
    <div class="input-section">
        <input type="text" id="movieInput" placeholder="영화 제목을 입력하세요..." onkeypress="if(event.keyCode==13) addMovie()">
        <button onclick="addMovie()">추가</button>
    </div>

    <!-- 영화 보관함 -->
    <div class="storage-container">
        <h3 style="margin-top:0">📦 영화 보관함 (여기로 드래그해서 회수 가능)</h3>
        <div id="movieStorage" class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <!-- 추가된 영화가 여기에 먼저 나타납니다 -->
        </div>
    </div>

    <!-- 티어 리스트 -->
    <div class="tier-container">
        <div class="tier-row">
            <div class="tier-label s-tier">S</div>
            <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a-tier">A</div>
            <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b-tier">B</div>
            <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c-tier">C</div>
            <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
    </div>

    <script>
        // 1. 영화 추가 기능
        function addMovie() {
            const input = document.getElementById('movieInput');
            const movieTitle = input.value.trim();

            if (movieTitle === "") {
                alert("영화 제목을 입력해 주세요!");
                return;
            }

            // 영화 요소 생성
            const movieElement = document.createElement('div');
            movieElement.className = 'movie-item';
            movieElement.innerText = movieTitle;
            
            // 드래그 속성 및 ID 부여
            movieElement.draggable = true;
            movieElement.id = 'movie-' + Date.now(); // 고유 ID 생성

            // 드래그 이벤트 연결
            movieElement.ondragstart = drag;

            // 보관함에 추가
            document.getElementById('movieStorage').appendChild(movieElement);
            
            // 입력창 비우기
            input.value = "";
        }

        // 2. 드래그 앤 드롭 로직
        function allowDrop(ev) {
            // 기본 동작을 막아야 드롭이 허용됨
            ev.preventDefault();
        }

        function drag(ev) {
            // 드래그하는 요소의 ID를 저장
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            // 마우스가 놓인 곳에서 가장 가까운 drop-zone을 찾아 이동
            const dropZone = ev.target.closest('.drop-zone');
            if (dropZone) {
                dropZone.appendChild(draggedElement);
            }
        }
    </script>
</body>
</html>
